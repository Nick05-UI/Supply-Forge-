<svg width="100" height="90" viewBox="0 0 100 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Box Gradients -->
    <linearGradient id="boxFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
  </defs>

  <!-- Blue Clipboard (Behind) -->
  <g transform="translate(14, 6)">
    <!-- Clipboard Board -->
    <rect x="10" y="8" width="46" height="64" rx="6" fill="#3B82F6"/>
    <!-- Clip Top -->
    <rect x="22" y="3" width="22" height="10" rx="3" fill="#93C5FD"/>
    <circle cx="33" cy="8" r="2.5" fill="#1D4ED8"/>
    <!-- Clipboard Paper -->
    <rect x="15" y="16" width="36" height="50" rx="4" fill="#FFFFFF"/>
    
    <!-- Checklist items (lines & checkmarks) -->
    <!-- Item 1 -->
    <circle cx="21" cy="25" r="3" fill="#DBEAFE"/>
    <path d="M19.5 25L20.8 26.3L22.8 23.8" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="27" y="23.5" width="20" height="3" rx="1.5" fill="#93C5FD"/>

    <!-- Item 2 -->
    <circle cx="21" cy="35" r="3" fill="#DBEAFE"/>
    <path d="M19.5 35L20.8 36.3L22.8 33.8" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="27" y="33.5" width="18" height="3" rx="1.5" fill="#93C5FD"/>

    <!-- Item 3 -->
    <circle cx="21" cy="45" r="3" fill="#DBEAFE"/>
    <path d="M19.5 45L20.8 46.3L22.8 43.8" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="27" y="43.5" width="16" height="3" rx="1.5" fill="#93C5FD"/>
  </g>

  <!-- Cardboard Box 1 (Bottom Right) -->
  <g transform="translate(48, 42)">
    <!-- Shadow -->
    <ellipse cx="20" cy="38" rx="18" ry="5" fill="#94A3B8" fill-opacity="0.25"/>
    <!-- Top Face -->
    <path d="M20 6L35 14L20 22L5 14L20 6Z" fill="url(#boxTop)"/>
    <!-- Left Face -->
    <path d="M5 14L20 22V37L5 29V14Z" fill="url(#boxFront)"/>
    <!-- Right Face -->
    <path d="M20 22L35 14V29L20 37V22Z" fill="url(#boxSide)"/>
    <!-- Tape -->
    <path d="M16 8.5L31 16.5" stroke="#FDE68A" stroke-width="3" stroke-linecap="round"/>
    <path d="M20 22V37" stroke="#EA580C" stroke-width="2"/>
  </g>

  <!-- Cardboard Box 2 (Stacked Top / In front) -->
  <g transform="translate(62, 26) scale(0.72)">
    <path d="M20 6L35 14L20 22L5 14L20 6Z" fill="url(#boxTop)"/>
    <path d="M5 14L20 22V37L5 29V14Z" fill="url(#boxFront)"/>
    <path d="M20 22L35 14V29L20 37V22Z" fill="url(#boxSide)"/>
    <path d="M16 8.5L31 16.5" stroke="#FDE68A" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
