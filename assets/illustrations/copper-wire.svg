<svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="copperGrad" x1="8" y1="10" x2="36" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="30%" stop-color="#EA580C"/>
      <stop offset="70%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <filter id="coilShadow" x="4" y="6" width="36" height="34" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7C2D12" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <g filter="url(#coilShadow)">
    <!-- Base coil torus -->
    <ellipse cx="22" cy="22" rx="15" ry="11" fill="url(#copperGrad)"/>
    <ellipse cx="22" cy="22" rx="7.5" ry="5.5" fill="#F8FAFC"/>
    
    <!-- Wire windings / rings -->
    <path d="M12 16C15 13 29 13 32 16" stroke="#FDBA74" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M10 19C14 16 30 16 34 19" stroke="#EA580C" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M9 22C13 18 31 18 35 22" stroke="#FDBA74" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M10 25C14 28 30 28 34 25" stroke="#9A3412" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M12 28C15 31 29 31 32 28" stroke="#7C2D12" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Tie band / cable tie -->
    <rect x="20.5" y="11" width="3" height="6" rx="1" fill="#FFFFFF" fill-opacity="0.85"/>
    <rect x="20.5" y="27" width="3" height="6" rx="1" fill="#FFFFFF" fill-opacity="0.85"/>
  </g>
</svg>
