<svg width="280" height="150" viewBox="0 0 280 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Box Gradients -->
    <linearGradient id="wbBox1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="wbBox2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="wbPlant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
  </defs>

  <!-- Potted Plant (Left) -->
  <g transform="translate(18, 102)">
    <!-- Pot -->
    <path d="M4 16L6 32H18L20 16H4Z" fill="#94A3B8"/>
    <ellipse cx="12" cy="16" rx="8" ry="2.5" fill="#64748B"/>
    <!-- Plant Leaves -->
    <path d="M12 15C9 9 5 8 2 12C3 6 8 4 12 15Z" fill="url(#wbPlant)"/>
    <path d="M12 15C12 7 10 3 13 0C15 5 15 10 12 15Z" fill="#22C55E"/>
    <path d="M12 15C15 9 19 8 22 12C21 6 16 4 12 15Z" fill="url(#wbPlant)"/>
    <path d="M12 15C8 12 7 15 5 18C7 16 9 14 12 15Z" fill="#15803D"/>
  </g>

  <!-- Worker / Manager Character -->
  <g transform="translate(42, 36)">
    <!-- Shadow -->
    <ellipse cx="28" cy="100" rx="20" ry="4" fill="#E2E8F0"/>

    <!-- Legs / Pants -->
    <path d="M22 84L20 98H26L28 84H22Z" fill="#1E3A8A"/>
    <path d="M30 84L32 98H38L36 84H30Z" fill="#1E3A8A"/>
    <!-- Shoes -->
    <rect x="18" y="96" width="10" height="4" rx="2" fill="#0F172A"/>
    <rect x="31" y="96" width="10" height="4" rx="2" fill="#0F172A"/>

    <!-- Torso / Blue Shirt -->
    <path d="M16 46C16 38 22 34 29 34C36 34 42 38 42 46V84H16V46Z" fill="#2563EB"/>
    <!-- Collar -->
    <path d="M25 34L29 40L33 34" fill="#1D4ED8"/>

    <!-- Head & Hair -->
    <ellipse cx="29" cy="22" rx="9" ry="10" fill="#F0B58D"/>
    <!-- Hair -->
    <path d="M20 20C20 12 24 9 30 9C36 9 39 12 39 18C37 16 34 15 30 15C25 15 22 17 20 20Z" fill="#0F172A"/>
    <!-- Ear -->
    <circle cx="20" cy="22" r="2" fill="#D49B72"/>
    <!-- Eye & Smile -->
    <circle cx="33" cy="21" r="1.2" fill="#1E293B"/>
    <path d="M31 26C33 27 35 27 36 26" stroke="#B45309" stroke-width="1" stroke-linecap="round"/>

    <!-- Arms holding tablet -->
    <path d="M18 46L26 62L34 58L22 44" fill="#1D4ED8"/>
    <!-- Hands & Tablet -->
    <rect x="29" y="50" width="22" height="15" rx="2" transform="rotate(-15 29 50)" fill="#1E293B"/>
    <rect x="31" y="52" width="18" height="11" rx="1" transform="rotate(-15 31 52)" fill="#38BDF8"/>
    <path d="M32 58L38 65" stroke="#F0B58D" stroke-width="3" stroke-linecap="round"/>
    <path d="M46 54L48 61" stroke="#F0B58D" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Warehouse Shelving Unit (Middle-Right) -->
  <g transform="translate(130, 20)">
    <!-- Uprights (Blue steel frame) -->
    <rect x="10" y="8" width="4" height="106" rx="1.5" fill="#3B82F6"/>
    <rect x="58" y="8" width="4" height="106" rx="1.5" fill="#3B82F6"/>
    <rect x="86" y="8" width="4" height="106" rx="1.5" fill="#3B82F6"/>

    <!-- Horizontal Shelves -->
    <!-- Top Shelf -->
    <rect x="8" y="24" width="82" height="4" rx="1" fill="#2563EB"/>
    <!-- Middle Shelf -->
    <rect x="8" y="58" width="82" height="4" rx="1" fill="#2563EB"/>
    <!-- Bottom Shelf -->
    <rect x="8" y="92" width="82" height="4" rx="1" fill="#2563EB"/>

    <!-- Cross bracing -->
    <line x1="12" y1="26" x2="58" y2="58" stroke="#93C5FD" stroke-width="1"/>
    <line x1="58" y1="26" x2="12" y2="58" stroke="#93C5FD" stroke-width="1"/>

    <!-- Boxes on Shelves -->
    <!-- Top shelf box 1 -->
    <rect x="18" y="10" width="16" height="14" rx="1.5" fill="url(#wbBox1)"/>
    <line x1="26" y1="10" x2="26" y2="24" stroke="#FB923C" stroke-width="1.5"/>
    <line x1="18" y1="17" x2="34" y2="17" stroke="#EA580C" stroke-width="1"/>

    <!-- Top shelf box 2 -->
    <rect x="37" y="12" width="14" height="12" rx="1.5" fill="url(#wbBox2)"/>
    <line x1="44" y1="12" x2="44" y2="24" stroke="#F97316" stroke-width="1.5"/>

    <!-- Middle shelf box 1 -->
    <rect x="16" y="42" width="22" height="16" rx="1.5" fill="url(#wbBox2)"/>
    <line x1="27" y1="42" x2="27" y2="58" stroke="#FED7AA" stroke-width="2"/>
    <rect x="19" y="47" width="5" height="4" fill="#FFFFFF" fill-opacity="0.8"/>

    <!-- Middle shelf box 2 -->
    <rect x="42" y="44" width="14" height="14" rx="1.5" fill="url(#wbBox1)"/>
    <line x1="49" y1="44" x2="49" y2="58" stroke="#F97316" stroke-width="1.5"/>

    <!-- Bottom shelf box 1 -->
    <rect x="15" y="74" width="20" height="18" rx="1.5" fill="url(#wbBox1)"/>
    <line x1="25" y1="74" x2="25" y2="92" stroke="#EA580C" stroke-width="2"/>

    <!-- Bottom shelf box 2 -->
    <rect x="38" y="76" width="18" height="16" rx="1.5" fill="url(#wbBox2)"/>
    <line x1="47" y1="76" x2="47" y2="92" stroke="#FDE68A" stroke-width="2"/>
  </g>

  <!-- Conveyor System (Front Right) -->
  <g transform="translate(120, 108)">
    <!-- Legs -->
    <rect x="15" y="16" width="4" height="18" fill="#475569"/>
    <rect x="65" y="16" width="4" height="18" fill="#475569"/>
    <rect x="115" y="16" width="4" height="18" fill="#475569"/>

    <!-- Conveyor Track Bed -->
    <rect x="4" y="8" width="140" height="10" rx="3" fill="#3B82F6"/>

    <!-- Rollers (circles) -->
    <circle cx="18" cy="13" r="3" fill="#FFFFFF"/>
    <circle cx="34" cy="13" r="3" fill="#FFFFFF"/>
    <circle cx="50" cy="13" r="3" fill="#FFFFFF"/>
    <circle cx="66" cy="13" r="3" fill="#FFFFFF"/>
    <circle cx="82" cy="13" r="3" fill="#FFFFFF"/>
    <circle cx="98" cy="13" r="3" fill="#FFFFFF"/>
    <circle cx="114" cy="13" r="3" fill="#FFFFFF"/>
    <circle cx="130" cy="13" r="3" fill="#FFFFFF"/>

    <!-- Boxes moving on conveyor -->
    <!-- Box on conveyor 1 -->
    <rect x="24" y="-8" width="18" height="16" rx="1.5" fill="url(#wbBox2)"/>
    <line x1="33" y1="-8" x2="33" y2="8" stroke="#FED7AA" stroke-width="2"/>

    <!-- Box on conveyor 2 -->
    <rect x="58" y="-10" width="22" height="18" rx="1.5" fill="url(#wbBox1)"/>
    <line x1="69" y1="-10" x2="69" y2="8" stroke="#F97316" stroke-width="2"/>
    <rect x="62" y="-5" width="5" height="4" fill="#FFFFFF" fill-opacity="0.8"/>
  </g>
</svg>
